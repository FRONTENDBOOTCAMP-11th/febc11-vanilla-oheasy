<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>로그인</title>
    <link rel="icon" type="image/svg+xml" href="/public/nike.png" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <a href="/index.html">
            <img src="../../assets/icons/logo.svg" />
          </a>
        </div>

        <div class="main signIn">
          <section class="email-section">
            <h1 class="title">
              가입 또는 로그인을 위해 <br />
              이메일을 입력하세요.
            </h1>
            <form class="signIn main">
              <div class="input-container">
                <input type="email" class="userEmail" />
                <span>이메일</span>
              </div>
              <div class="email-result"></div>

              <p class="description">
                계속 진행하면 나이키의 <a href="#">개인정보 처리방침</a> 및
                <a href="#">이용약관</a>에 동의하게 됩니다.
              </p>
              <div
                class="button-box"
                data-theme="black"
                data-width="90px"
                data-height="52px"
                id="proceed"
              >
                계속
              </div>
            </form>
          </section>

          <section class="pwd-section hidden">
            <h1 class="title">비밀번호를 입력하세요.</h1>
            <p class="received_email"></p>
            <form class="signIn pwd">
              <div class="input-container pwd">
                <img class="eye-icon" src="../../assets/icons/eye.svg" />
                <input
                  type="password"
                  class="userPwd"
                  maxlength="12"
                  style="width: 100%"
                />
                <span>비밀번호</span>
              </div>
              <p class="description"><a href="#">비밀번호 찾기</a></p>
              <div class="pwd-result"></div>
            </form>
            <div class="signIn-pwd-btn">
              <div
                class="button-box"
                data-theme="white"
                data-width="90px"
                data-height="52px"
                id="previous"
              >
                이전
              </div>
              <div
                class="button-box"
                data-theme="black"
                data-width="105px"
                data-height="52px"
                id="login"
              >
                로그인
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="../../components/button.js"></script>
  <script type="module" src="signIn_main.js"></script>
</html>
